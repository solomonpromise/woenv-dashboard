server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; index.html must never be cached or users
    # keep loading an old bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy the API so the browser stays same-origin and VITE_API_URL can be
    # left empty in the container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # workbook ingestion can be slow
        client_max_body_size 50m;  # matches MAX_UPLOAD_SIZE
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
